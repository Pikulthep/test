name: Daily KicksBall Scrape

on:
  schedule:
    - cron: '0 2 * * *' # รันอัตโนมัติทุกวันเวลา 02:00 UTC (ประมาณ 09:00 น. เวลาไทย)
  workflow_dispatch: # เปิดปุ่มให้กด Run แบบ Manual ได้

permissions:
  contents: write

jobs:
  run-tv-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # สคริปต์นี้รันไวมาก ตั้งเวลาเผื่อไว้แค่ 10 นาทีก็เหลือเฟือครับ

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directory
        run: mkdir -p output

      # 🌟 รันสคริปต์ดึงข้อมูลทีวี (ไม่ต้องมี xvfb แล้ว)
      - name: Run KicksBall TV Script
        run: python kicksball_tv.py

      - name: Commit and Push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update KicksBall TV: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes to commit"
          fi
