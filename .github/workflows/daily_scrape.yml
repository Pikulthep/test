name: Daily KicksBall Scrape

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-tv-scraper:
    runs-on: windows-latest  # 🌟 ไม้ตาย: เปลี่ยนเซิร์ฟเวอร์เป็น Windows!
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directory
        run: mkdir output

      # 🌟 รันสคริปต์บน Windows ตรงๆ (มันจะเปิด Chrome ขึ้นมาแบบมีหน้าต่างจริงๆ)
      - name: Run KicksBall TV Script
        run: python kicksball_tv.py

      # ใช้ shell: bash เพื่อให้คำสั่ง Git ทำงานได้ปกติบน Windows
      - name: Commit and Push results
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*
          
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update KicksBall TV: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes to commit"
          fi
